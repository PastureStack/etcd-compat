name: CodeQL verification

on:
  push:
    branches:
      - 'verification/etcd-compat-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etcd-compat-codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate shape
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-list --count fd17c9101d94703f6f4c3d8d6cfb72b62b894cd7..HEAD)" -eq 1

      - name: Install checksum-pinned Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go1.26.5.linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            'https://go.dev/dl/go1.26.5.linux-amd64.tar.gz'
          printf '%s  %s\n' \
            '5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053' \
            "$archive" | sha256sum --check
          tar -C "$RUNNER_TEMP" -xzf "$archive"
          "$RUNNER_TEMP/go/bin/go" version
          printf '%s\n' "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          printf 'GOROOT=%s\n' "$RUNNER_TEMP/go" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: go
          build-mode: manual
          config: |
            queries:
              - uses: security-extended
            threat-models: local

      - name: Build source
        shell: bash
        run: |
          set -euo pipefail
          export GO111MODULE=off
          export GOPATH="$GITHUB_WORKSPACE/gopath"
          mkdir -p "$GOPATH/src/github.com/coreos"
          ln -s "$GITHUB_WORKSPACE" "$GOPATH/src/github.com/coreos/etcd"
          cd "$GOPATH/src/github.com/coreos/etcd"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/etcd" github.com/coreos/etcd
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/etcdctl" github.com/coreos/etcd/etcdctl
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/etcdwrapper" github.com/coreos/etcd/package/etcdwrapper

      - name: Analyze without publishing temporary alerts
        uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          category: /language:go
          upload: never
          output: codeql-results

      - name: Reject Critical and High findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json

          blocked = []
          unresolved = []
          total = 0
          for path in glob.glob('codeql-results/**/*.sarif', recursive=True):
              with open(path, encoding='utf-8') as stream:
                  sarif = json.load(stream)
              for run in sarif.get('runs', []):
                  rules = {rule.get('id'): rule for rule in run.get('tool', {}).get('driver', {}).get('rules', [])}
                  for extension in run.get('tool', {}).get('extensions', []):
                      rules.update({rule.get('id'): rule for rule in extension.get('rules', [])})
                  for result in run.get('results', []):
                      total += 1
                      rule_id = result.get('ruleId')
                      rule = rules.get(rule_id)
                      if rule is None:
                          unresolved.append((rule_id, 'missing rule metadata'))
                          continue
                      try:
                          score = float(rule.get('properties', {}).get('security-severity', '0'))
                      except (TypeError, ValueError):
                          unresolved.append((rule_id, 'invalid security severity'))
                          continue
                      if score >= 7.0:
                          location = result.get('locations', [{}])[0].get('physicalLocation', {})
                          blocked.append((rule_id, score, location.get('artifactLocation', {}).get('uri', 'unknown'), location.get('region', {}).get('startLine', 0)))
          print(f'codeql_total={total}')
          print(f'codeql_critical_high={len(blocked)}')
          print(f'codeql_unresolved_rule_metadata={len(unresolved)}')
          for finding in blocked:
              print(f'{finding[0]}\t{finding[1]}\t{finding[2]}:{finding[3]}')
          for finding in unresolved:
              print(f'{finding[0]}\t{finding[1]}')
          if blocked or unresolved:
              raise SystemExit(1)
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etcd-compat-codeql-${{ github.sha }}
          path: codeql-results/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
