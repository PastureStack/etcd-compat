allow-rules:
  - id: inherited-http2-demo-keys
    description: Public upstream HTTP/2 demo fixtures, content-hash-pinned by scripts/validate and excluded from the runtime image.
    path: (^|/)Godeps/_workspace/src/golang\.org/x/net/http2/h2demo/(rootCA|server)\.key$
  - id: inherited-etcd-integration-key
    description: Public upstream etcd integration-test fixture, content-hash-pinned by scripts/validate and excluded from the runtime image.
    path: (^|/)integration/fixtures/server\.key\.insecure$
